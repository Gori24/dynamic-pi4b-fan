[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-pi4b-fan"
version = "1.0.0"
description = "REST API service for Raspberry Pi fan control"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "RPi.GPIO==0.7.1",
]

[project.scripts]
dynamic-pi4b-fan = "dynamic_pi4b_fan.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
