[server]
host = "0.0.0.0"
port = 8081
auth_token = "changeme8"

[fan]
gpio_pin = 17
temp_on_c = 60.0
temp_off_c = 50.0
poll_interval_seconds = 5
min_allowed_temp_c = 35.0
