# REST calls to the dynamic-pi4b-fan API.
# Home Assistant runs with network_mode: host on the same Pi, so localhost works.
set_pi_fan_mode:
  url: "http://127.0.0.1:8081/api/fan"
  method: POST
  headers:
    Authorization: !secret pi_fan_api_auth
    Content-Type: "application/json"
  payload: '{"mode":"{{ mode }}"}'

set_pi_fan_duty:
  url: "http://127.0.0.1:8081/api/fan"
  method: POST
  headers:
    Authorization: !secret pi_fan_api_auth
    Content-Type: "application/json"
  payload: '{"mode":"manual","duty_percent":{{ duty_percent | int }}}'

set_pi_fan_thresholds:
  url: "http://127.0.0.1:8081/api/thresholds"
  method: POST
  headers:
    Authorization: !secret pi_fan_api_auth
    Content-Type: "application/json"
  payload: '{"temp_on_c":{{ temp_on_c }},"temp_off_c":{{ temp_off_c }}}'
