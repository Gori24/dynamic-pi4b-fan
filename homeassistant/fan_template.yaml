# All controls read their state from sensor.pi_fan_status. After every change the
# sensor is refreshed immediately, so the UI does not wait for the next poll.
- fan:
    # Main control, also exported to HomeKit. unique_id pi4b_fan keeps fan.pi4b_fan.
    # On = auto mode, percentage = manual duty (0 % = off), preset "auto" = curve.
    - name: "Pi4B Fan"
      unique_id: pi4b_fan
      availability: "{{ states('sensor.pi_fan_status') not in ['unavailable', 'unknown'] }}"
      state: "{{ state_attr('sensor.pi_fan_status', 'fan_on') | default(false) }}"
      percentage: "{{ state_attr('sensor.pi_fan_status', 'duty_percent') | int(0) }}"
      preset_mode: "{{ 'auto' if state_attr('sensor.pi_fan_status', 'mode') == 'auto' else none }}"
      preset_modes:
        - auto
      speed_count: 100
      turn_on:
        - if: "{{ (percentage | default(0, true) | int(0)) > 0 and (preset_mode | default(none)) != 'auto' }}"
          then:
            - action: rest_command.set_pi_fan_duty
              data:
                duty_percent: "{{ percentage }}"
          else:
            - action: rest_command.set_pi_fan_mode
              data:
                mode: auto
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status
      turn_off:
        - action: rest_command.set_pi_fan_mode
          data:
            mode: "off"
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status
      set_percentage:
        - if: "{{ percentage | int(0) == 0 }}"
          then:
            - action: rest_command.set_pi_fan_mode
              data:
                mode: "off"
          else:
            - action: rest_command.set_pi_fan_duty
              data:
                duty_percent: "{{ percentage }}"
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status
      set_preset_mode:
        - action: rest_command.set_pi_fan_mode
          data:
            mode: auto
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status

  select:
    - name: "Pi Fan Mode"
      unique_id: pi_fan_mode
      availability: "{{ states('sensor.pi_fan_status') not in ['unavailable', 'unknown'] }}"
      state: "{{ state_attr('sensor.pi_fan_status', 'mode') | default('auto') }}"
      options: "{{ ['auto', 'manual', 'off'] }}"
      select_option:
        - action: rest_command.set_pi_fan_mode
          data:
            mode: "{{ option }}"
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status

  # Hysteresis thresholds: only used with idle_behavior = "off" in the service config.
  number:
    - name: "Pi Fan Temp On"
      unique_id: pi_fan_temp_on_c_live
      availability: "{{ states('sensor.pi_fan_status') not in ['unavailable', 'unknown'] }}"
      state: "{{ state_attr('sensor.pi_fan_status', 'temp_on_c') | float(60) }}"
      min: 40
      max: 85
      step: 0.5
      unit_of_measurement: "°C"
      set_value:
        - variables:
            current_off: "{{ state_attr('sensor.pi_fan_status', 'temp_off_c') | float(50) }}"
        - variables:
            # temp_on must stay above temp_off; clamp instead of failing
            new_on: "{{ [value | float, current_off + 0.5] | max }}"
        - action: rest_command.set_pi_fan_thresholds
          data:
            temp_on_c: "{{ new_on }}"
            temp_off_c: "{{ current_off }}"
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status

    - name: "Pi Fan Temp Off"
      unique_id: pi_fan_temp_off_c_live
      availability: "{{ states('sensor.pi_fan_status') not in ['unavailable', 'unknown'] }}"
      state: "{{ state_attr('sensor.pi_fan_status', 'temp_off_c') | float(50) }}"
      min: 35
      max: 80
      step: 0.5
      unit_of_measurement: "°C"
      set_value:
        - variables:
            current_on: "{{ state_attr('sensor.pi_fan_status', 'temp_on_c') | float(60) }}"
        - variables:
            # temp_off must stay below temp_on; clamp instead of failing
            new_off: "{{ [value | float, current_on - 0.5] | min }}"
        - action: rest_command.set_pi_fan_thresholds
          data:
            temp_on_c: "{{ current_on }}"
            temp_off_c: "{{ new_off }}"
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.pi_fan_status
